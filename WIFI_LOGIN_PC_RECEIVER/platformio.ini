; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; This module has 4MB flash and no usable OPI PSRAM. Without these the build
; assumes 8MB + PSRAM and the chip fails to boot (flash probe / SPIRAM bail-out).
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
; Board default is ARDUINO_USB_MODE=1 (HWCDC via the USB-Serial-JTAG
; peripheral), which does NOT support composite USB devices. This board
; needs a HID keyboard alongside its serial port (to bootstrap Wi-Fi
; provisioning on a PC it has no other access to), so switch to native
; USB OTG mode (TinyUSB) — Serial keeps working the same from the sketch's
; point of view, just backed by USBCDC instead of HWCDC.
build_flags =
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=1
; Native USB OTG mode means esptool's reset-into-bootloader handshake drops
; and re-enumerates the CDC port itself, which macOS's serial driver can
; lose mid-handshake ("Device not configured"). use_1200bps_touch performs
; the reset the same way Arduino Leonardo-style native-USB boards do;
; wait_for_upload_port waits for the port to come back (possibly under a
; new /dev path) instead of failing the moment it disappears.
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit NeoMatrix
	adafruit/Adafruit NeoPixel
