; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; This module has 4MB flash and 2MB QSPI PSRAM (not OPI). Without pinning the
; flash size and memory_type, the build assumes 8MB flash + OPI PSRAM and the
; chip fails to boot (flash probe / SPIRAM bail-out). qio_qspi = QIO flash +
; QSPI PSRAM, which matches this variant.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
lib_deps =
	adafruit/Adafruit GFX Library
	adafruit/Adafruit NeoMatrix
	adafruit/Adafruit NeoPixel
	fortyseveneffects/MIDI Library
